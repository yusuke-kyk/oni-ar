<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AR妖怪</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;
    }


    video {
      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      z-index: 0 !important;
    }


    a-scene {
      position: fixed !important;

      top: 0;
      left: 0;

      width: 100vw !important;
      height: 100vh !important;

      z-index: 1;

      background: transparent !important;
    }


    .a-canvas {
      background: transparent !important;
    }


    /*
    =========================================
    上部案内
    =========================================
    */

    .guide {
      position: fixed;

      z-index: 9999;

      left: 50%;

      top:
        max(
          16px,
          env(safe-area-inset-top)
        );

      transform:
        translateX(-50%);

      width:
        calc(100% - 32px);

      max-width: 460px;

      box-sizing:
        border-box;

      padding:
        10px 14px;

      border-radius:
        12px;

      background:
        rgba(0, 0, 0, 0.55);

      color:
        white;

      text-align:
        center;

      font-family:
        sans-serif;

      font-size:
        14px;

      line-height:
        1.5;

      pointer-events:
        none;
    }


    /*
    =========================================
    ガシャ髑髏登場時の暗転
    =========================================
    */

    #darkOverlay {
      position: fixed;

      inset: 0;

      z-index: 5000;

      background:
        rgba(0, 0, 0, 0);

      pointer-events:
        none;

      transition:
        background 0.6s ease;
    }


    #darkOverlay.active {
      background:
        rgba(0, 0, 0, 0.25);
    }


    /*
    =========================================
    最後の一瞬の赤フラッシュ
    =========================================
    */

    #flashOverlay {
      position: fixed;

      inset: 0;

      z-index: 6000;

      background:
        rgba(120, 0, 0, 0);

      pointer-events:
        none;
    }


    #flashOverlay.flash {
      animation:
        scaryFlash 0.35s ease-out;
    }


    @keyframes scaryFlash {

      0% {
        background:
          rgba(120, 0, 0, 0);
      }

      25% {
        background:
          rgba(120, 0, 0, 0.22);
      }

      100% {
        background:
          rgba(120, 0, 0, 0);
      }

    }

  </style>

</head>


<body>


  <div id="darkOverlay"></div>

  <div id="flashOverlay"></div>


  <div class="guide">

    👹 AR妖怪<br>

    絵や札に
    スマホを向けてください

  </div>



  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

  >



    <!--
    =========================================
    素材
    =========================================
    -->

    <a-assets>


      <!-- 豆腐小僧 -->

      <img id="tofu01" src="./tofu01.png" crossorigin="anonymous">
      <img id="tofu02" src="./tofu02.png" crossorigin="anonymous">
      <img id="tofu03" src="./tofu03.png" crossorigin="anonymous">
      <img id="tofu04" src="./tofu04.png" crossorigin="anonymous">
      <img id="tofu05" src="./tofu05.png" crossorigin="anonymous">


      <!-- ガシャ髑髏 -->

      <img id="gasha01" src="./gasha01.png" crossorigin="anonymous">
      <img id="gasha02" src="./gasha02.png" crossorigin="anonymous">
      <img id="gasha03" src="./gasha03.png" crossorigin="anonymous">
      <img id="gasha04" src="./gasha04.png" crossorigin="anonymous">
      <img id="gasha05" src="./gasha05.png" crossorigin="anonymous">


    </a-assets>



    <!-- カメラ -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    >
    </a-camera>



    <!--
    =========================================
    TARGET 0
    豆腐小僧
    =========================================
    -->

    <a-entity

      id="tofuTarget"

      mindar-image-target="
        targetIndex: 1
      "

    >


      <a-entity

        id="tofuWalker"

        position="
          1
          -0.18
          0.01
        "

        visible="false"

      >


        <a-image

          id="tofuSprite"

          src="#tofu01"

          width="0.72"

          height="1.02"

          position="0 0 0"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "

        >
        </a-image>


      </a-entity>


    </a-entity>



    <!--
    =========================================
    TARGET 1
    ガシャ髑髏
    =========================================
    -->

    <a-entity

      id="gashaTarget"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <a-entity

        id="gashaMonster"

        position="
          0
          -1.25
          0.01
        "

        scale="
          0.25
          0.25
          0.25
        "

        rotation="
          0
          0
          -2
        "

        visible="false"

      >


        <a-image

          id="gashaSprite"

          src="#gasha01"

          width="1.3"

          height="1.8"

          position="
            0
            0
            0
          "

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "

        >
        </a-image>


      </a-entity>


    </a-entity>



  </a-scene>



<script>


document.addEventListener(

  "DOMContentLoaded",

  () => {



    /*
    =========================================
    要素取得
    =========================================
    */


    const tofuTarget =
      document.getElementById(
        "tofuTarget"
      );


    const tofuWalker =
      document.getElementById(
        "tofuWalker"
      );


    const tofuSprite =
      document.getElementById(
        "tofuSprite"
      );


    const gashaTarget =
      document.getElementById(
        "gashaTarget"
      );


    const gashaMonster =
      document.getElementById(
        "gashaMonster"
      );


    const gashaSprite =
      document.getElementById(
        "gashaSprite"
      );


    const darkOverlay =
      document.getElementById(
        "darkOverlay"
      );


    const flashOverlay =
      document.getElementById(
        "flashOverlay"
      );



    /*
    =========================================
    豆腐小僧
    =========================================
    */


    const tofuFrames = [

      "#tofu01",
      "#tofu02",
      "#tofu03",
      "#tofu04",
      "#tofu05"

    ];


    const TOFU_FRAME_INTERVAL =
      130;


    const TOFU_WALK_DURATION =
      6500;


    const TOFU_START_POS = {

      x: 1.0,
      y: -0.18,
      z: 0.01

    };


    const TOFU_END_POS = {

      x: -2.2,
      y: -0.18,
      z: 0.01

    };


    let tofuFrameTimer =
      null;


    let tofuFinishTimer =
      null;


    let tofuFrameIndex =
      0;


    let tofuAnimating =
      false;



    function setTofuPosition(
      pos
    ) {

      tofuWalker.setAttribute(

        "position",

        `${pos.x} ${pos.y} ${pos.z}`

      );

    }



    function resetTofuFrame() {

      tofuFrameIndex =
        0;


      tofuSprite.setAttribute(

        "src",

        tofuFrames[0]

      );

    }



    function stopTofuFrameLoop() {

      if (
        tofuFrameTimer
      ) {

        clearInterval(
          tofuFrameTimer
        );


        tofuFrameTimer =
          null;

      }

    }



    function startTofuFrameLoop() {

      stopTofuFrameLoop();


      tofuFrameTimer =

        setInterval(

          () => {


            tofuFrameIndex =

              (
                tofuFrameIndex
                +
                1
              )

              %

              tofuFrames.length;


            tofuSprite.setAttribute(

              "src",

              tofuFrames[
                tofuFrameIndex
              ]

            );

          },

          TOFU_FRAME_INTERVAL

        );

    }



    function resetTofu() {

      stopTofuFrameLoop();


      if (
        tofuFinishTimer
      ) {

        clearTimeout(
          tofuFinishTimer
        );


        tofuFinishTimer =
          null;

      }


      tofuWalker.removeAttribute(
        "animation__walk"
      );


      setTofuPosition(
        TOFU_START_POS
      );


      resetTofuFrame();


      tofuWalker.setAttribute(
        "visible",
        false
      );


      tofuAnimating =
        false;

    }



    function startTofuWalking() {

      if (
        tofuAnimating
      ) {

        return;

      }


      tofuAnimating =
        true;


      resetTofuFrame();


      setTofuPosition(
        TOFU_START_POS
      );


      tofuWalker.setAttribute(
        "visible",
        true
      );


      startTofuFrameLoop();


      tofuWalker.removeAttribute(
        "animation__walk"
      );


      setTimeout(

        () => {


          tofuWalker.setAttribute(

            "animation__walk",

            `
            property: position;

            from:
              ${TOFU_START_POS.x}
              ${TOFU_START_POS.y}
              ${TOFU_START_POS.z};

            to:
              ${TOFU_END_POS.x}
              ${TOFU_END_POS.y}
              ${TOFU_END_POS.z};

            dur:
              ${TOFU_WALK_DURATION};

            easing:
              linear;

            loop:
              false;
            `

          );

        },

        30

      );


      tofuFinishTimer =

        setTimeout(

          () => {


            stopTofuFrameLoop();


            tofuWalker.setAttribute(
              "visible",
              false
            );


            tofuAnimating =
              false;

          },

          TOFU_WALK_DURATION

        );

    }



    /*
    =========================================
    ガシャ髑髏
    =========================================
    */


    const gashaFrames = [

      "#gasha01",
      "#gasha02",
      "#gasha03",
      "#gasha04",
      "#gasha05"

    ];


    let gashaTimers = [];


    let gashaAnimating =
      false;



    function clearGashaTimers() {

      gashaTimers.forEach(

        timer =>
          clearTimeout(timer)

      );


      gashaTimers = [];

    }



    function showGashaFrame(
      index
    ) {


      gashaSprite.setAttribute(

        "src",

        gashaFrames[index]

      );

    }



    /*
    =========================================
    ガシャ髑髏リセット
    =========================================
    */


    function resetGasha() {


      clearGashaTimers();


      gashaMonster.removeAttribute(
        "animation__position"
      );


      gashaMonster.removeAttribute(
        "animation__scale"
      );


      gashaMonster.removeAttribute(
        "animation__sway"
      );


      gashaMonster.setAttribute(

        "position",

        "0 -1.25 0.01"

      );


      gashaMonster.setAttribute(

        "scale",

        "0.25 0.25 0.25"

      );


      gashaMonster.setAttribute(

        "rotation",

        "0 0 -2"

      );


      showGashaFrame(
        0
      );


      gashaMonster.setAttribute(

        "visible",

        false

      );


      darkOverlay
        .classList
        .remove(
          "active"
        );


      flashOverlay
        .classList
        .remove(
          "flash"
        );


      gashaAnimating =
        false;

    }



    /*
    =========================================
    怖いガシャ髑髏開始
    =========================================
    */


    function startGashaScare() {


      if (
        gashaAnimating
      ) {

        return;

      }


      gashaAnimating =
        true;



      /*
      -----------------------------------------
      STEP 1
      下からゆっくり現れる
      -----------------------------------------
      */


      showGashaFrame(
        0
      );


      gashaMonster.setAttribute(
        "visible",
        true
      );


      darkOverlay
        .classList
        .add(
          "active"
        );


      gashaMonster.setAttribute(

        "animation__position",

        `
        property: position;

        from:
          0 -1.25 0.01;

        to:
          0 -0.25 0.01;

        dur:
          1800;

        easing:
          easeOutQuad;

        loop:
          false;
        `

      );


      gashaMonster.setAttribute(

        "animation__scale",

        `
        property: scale;

        from:
          0.25 0.25 0.25;

        to:
          0.85 0.85 0.85;

        dur:
          1800;

        easing:
          easeOutQuad;

        loop:
          false;
        `

      );



      /*
      700ms
      顔＋肩
      */


      gashaTimers.push(

        setTimeout(

          () => {

            showGashaFrame(
              1
            );

          },

          700

        )

      );



      /*
      1300ms
      上半身
      */


      gashaTimers.push(

        setTimeout(

          () => {

            showGashaFrame(
              2
            );

          },

          1300

        )

      );



      /*
      -----------------------------------------
      STEP 2
      じわじわ近付く
      -----------------------------------------
      */


      gashaTimers.push(

        setTimeout(

          () => {


            showGashaFrame(
              3
            );


            /*
            左右に不気味に揺れる
            */

            gashaMonster.setAttribute(

              "animation__sway",

              `
              property: rotation;

              from:
                0 0 -2;

              to:
                0 0 2;

              dur:
                260;

              dir:
                alternate;

              easing:
                easeInOutSine;

              loop:
                true;
              `

            );


            /*
            さらに近付く
            */

            gashaMonster.removeAttribute(
              "animation__position"
            );


            gashaMonster.removeAttribute(
              "animation__scale"
            );


            gashaMonster.setAttribute(

              "animation__position",

              `
              property: position;

              to:
                0 0.12 0.01;

              dur:
                1700;

              easing:
                easeInOutQuad;

              loop:
                false;
              `

            );


            gashaMonster.setAttribute(

              "animation__scale",

              `
              property: scale;

              to:
                1.30 1.30 1.30;

              dur:
                1700;

              easing:
                easeInOutQuad;

              loop:
                false;
              `

            );

          },

          1800

        )

      );



      /*
      -----------------------------------------
      STEP 3
      最後に一気に迫る
      -----------------------------------------
      */


      gashaTimers.push(

        setTimeout(

          () => {


            showGashaFrame(
              4
            );


            gashaMonster.removeAttribute(
              "animation__sway"
            );


            gashaMonster.removeAttribute(
              "animation__position"
            );


            gashaMonster.removeAttribute(
              "animation__scale"
            );


            /*
            赤フラッシュ
            */

            flashOverlay
              .classList
              .remove(
                "flash"
              );


            void
              flashOverlay.offsetWidth;


            flashOverlay
              .classList
              .add(
                "flash"
              );


            /*
            ズンッ！
            */

            gashaMonster.setAttribute(

              "animation__position",

              `
              property: position;

              to:
                0 0.30 0.01;

              dur:
                450;

              easing:
                easeOutExpo;

              loop:
                false;
              `

            );


            gashaMonster.setAttribute(

              "animation__scale",

              `
              property: scale;

              to:
                2.05 2.05 2.05;

              dur:
                450;

              easing:
                easeOutExpo;

              loop:
                false;
              `

            );

          },

          3600

        )

      );



      /*
      -----------------------------------------
      最後はそのまま残す
      -----------------------------------------
      */


      gashaTimers.push(

        setTimeout(

          () => {


            gashaAnimating =
              false;

          },

          4300

        )

      );


    }



    /*
    =========================================
    豆腐小僧イベント
    =========================================
    */


    tofuTarget.addEventListener(

      "targetFound",

      () => {


        resetTofu();

        startTofuWalking();

      }

    );


    tofuTarget.addEventListener(

      "targetLost",

      () => {

        resetTofu();

      }

    );



    /*
    =========================================
    ガシャ髑髏イベント
    =========================================
    */


    gashaTarget.addEventListener(

      "targetFound",

      () => {


        resetGasha();

        startGashaScare();

      }

    );


    gashaTarget.addEventListener(

      "targetLost",

      () => {

        resetGasha();

      }

    );



    /*
    =========================================
    初期化
    =========================================
    */


    resetTofu();

    resetGasha();


  }

);

</script>


</body>

</html>
