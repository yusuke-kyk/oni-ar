<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10111b">
<title>光陽祭｜AR百鬼夜行</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  *,*::before,*::after {box-sizing:border-box}
  html,body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#080811;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  video {position:fixed!important;top:0!important;left:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important;z-index:0!important}
  a-scene {position:fixed!important;inset:0;width:100vw!important;height:100vh!important;background:transparent!important;z-index:1}
  .a-canvas {background:transparent!important}
  #guide {position:fixed;z-index:10010;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:500px;background:rgba(9,11,21,.79);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;text-align:center;font-size:14px;line-height:1.45;pointer-events:none;transition:opacity .3s ease}
  #guide.hide {opacity:0}
  #guide strong {font-size:15px;color:#f6e0a9}
  #guide small {display:block;color:#d7d6e4;margin-top:4px;font-size:12px}
  #darkOverlay,#flashOverlay {position:fixed;inset:0;pointer-events:none}
  #darkOverlay {z-index:8000;background:rgba(0,0,0,0);transition:background .6s}
  #darkOverlay.active {background:rgba(0,0,0,.25)}
  #flashOverlay {z-index:8001;background:rgba(110,0,0,0)}
  #flashOverlay.flash {animation:scaryFlash .36s ease-out}
  @keyframes scaryFlash {0%,100%{background:rgba(110,0,0,0)}25%{background:rgba(150,0,0,.3)}}
  #help {position:fixed;z-index:10020;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(8,9,20,.6);color:#e9e8f0;border-radius:24px;padding:7px 13px;white-space:nowrap;font-size:11px;pointer-events:none}
  #error {position:fixed;z-index:12000;left:12px;right:12px;bottom:calc(50px + env(safe-area-inset-bottom));padding:13px;border-radius:10px;color:white;background:rgba(100,26,25,.95);font-size:13px;line-height:1.5;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="darkOverlay"></div><div id="flashOverlay"></div>
<div id="guide"><strong>AR百鬼夜行</strong><small>カメラを準備しています…</small></div>
<div id="help">絵や模造紙にスマホを向けよう</div>
<div id="error" role="alert"></div>

<!-- MindARで11枚を「豆腐→ガシャ→緑鬼→付喪神→牛鬼→盥→百鬼夜行→模造紙1～4」の順番でコンパイルした前提です -->
<a-scene id="scene"
  mindar-image="imageTargetSrc: ./targets.mind?v=20261031-11; autoStart: true; maxTrack: 1; uiLoading: yes; uiScanning: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true; antialias: true;"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="anchor0" mindar-image-target="targetIndex: 0"><a-entity id="performer0" visible="false"></a-entity></a-entity>
  <a-entity id="anchor1" mindar-image-target="targetIndex: 1"><a-entity id="performer1" visible="false"></a-entity></a-entity>
  <a-entity id="anchor2" mindar-image-target="targetIndex: 2"><a-entity id="performer2" visible="false"></a-entity></a-entity>
  <a-entity id="anchor3" mindar-image-target="targetIndex: 3"><a-entity id="performer3" visible="false"></a-entity></a-entity>
  <a-entity id="anchor4" mindar-image-target="targetIndex: 4"><a-entity id="performer4" visible="false"></a-entity></a-entity>
  <a-entity id="anchor5" mindar-image-target="targetIndex: 5"><a-entity id="performer5" visible="false"></a-entity></a-entity>
  <a-entity id="anchor6" mindar-image-target="targetIndex: 6"><a-entity id="performer6" visible="false"></a-entity></a-entity>
  <a-entity id="anchor7" mindar-image-target="targetIndex: 7"><a-entity id="performer7" visible="false"></a-entity></a-entity>
  <a-entity id="anchor8" mindar-image-target="targetIndex: 8"><a-entity id="performer8" visible="false"></a-entity></a-entity>
  <a-entity id="anchor9" mindar-image-target="targetIndex: 9"><a-entity id="performer9" visible="false"></a-entity></a-entity>
  <a-entity id="anchor10" mindar-image-target="targetIndex: 10"><a-entity id="performer10" visible="false"></a-entity></a-entity>
</a-scene>

<script>
(() => {
  'use strict';
  const VERSION = '20261031-11';
  const scene = document.getElementById('scene');
  const guide = document.getElementById('guide');
  const errorBox = document.getElementById('error');
  const darkOverlay = document.getElementById('darkOverlay');
  const flashOverlay = document.getElementById('flashOverlay');

  // ※targetIndexの順番は、MindAR Compilerへ画像を追加した順番と一致させること。
  // 55枚すべては起動時に読まず、認識した妖怪の5枚だけを読み込みます。
  const cfg = [
    { name:'豆腐小僧', key:'tofu', prefix:'tofu', kind:'walk', width:0.72, frameMs:135, duration:6500 },
    { name:'ガシャ髑髏', key:'gasha', prefix:'gasha', kind:'gasha', width:1.3, frameMs:250, duration:4700 },
    { name:'緑鬼', key:'midori', prefix:'midori', kind:'spinAway', width:1.05, frameMs:210, duration:5600 },
    { name:'付喪神', key:'tsukumo', prefix:'tsukumo', kind:'dance', width:1.2, frameMs:205, duration:5800 },
    { name:'牛鬼', key:'ushi', prefix:'ushi', kind:'crawl', width:1.1, frameMs:180, duration:7200 },
    { name:'盥の妖怪', key:'tarai', prefix:'tarai', kind:'slither', width:1.1, frameMs:180, duration:7000 },
    { name:'百鬼夜行', key:'hyakki', prefix:'hyakki', kind:'parade', width:1.2, frameMs:950, duration:5600 },
    { name:'模造紙①', key:'poster01', prefix:'poster01_', kind:'poster', width:0.88, frameMs:300, duration:0 },
    { name:'模造紙②', key:'poster02', prefix:'poster02_', kind:'poster', width:0.88, frameMs:300, duration:0 },
    { name:'模造紙③', key:'poster03', prefix:'poster03_', kind:'poster', width:0.88, frameMs:300, duration:0 },
    { name:'模造紙④', key:'poster04', prefix:'poster04_', kind:'poster', width:0.88, frameMs:300, duration:0 },
  ].map((c, idx) => ({ ...c, idx, frames: Array.from({length:5},(_,i) => `./${c.prefix}${String(i+1).padStart(2,'0')}.png`) }));

  const performers = cfg.map(c => document.getElementById('performer'+c.idx));
  const anchors = cfg.map(c => document.getElementById('anchor'+c.idx));
  const gfx = cfg.map(() => null);
  const imagePromises = new Map();
  let active = -1;
  let playback = null;
  let raf = 0;
  let trackingToken = 0;
  let guideTimer = null;

  function say(title, detail='') {
    clearTimeout(guideTimer);
    guide.classList.remove('hide');
    guide.innerHTML = `<strong>${title}</strong>${detail ? `<small>${detail}</small>` : ''}`;
  }
  function hideGuideSoon() {
    clearTimeout(guideTimer);
    guideTimer = setTimeout(() => guide.classList.add('hide'), 1350);
  }
  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
    say('読み込みを確認してください', '詳しい情報が画面下に表示されています');
  }
  const lerp = (a,b,t) => a+(b-a)*t;
  const clamp = t => Math.max(0,Math.min(1,t));
  const ease = t => t*t*(3-2*t);
  const rad = d => d*Math.PI/180;

  // 同時に約55枚の画像を読み込まないため、妖怪が見つかったときのみ5枚を読み込む。
  async function loadImages(c) {
    if(imagePromises.has(c.key)) return imagePromises.get(c.key);
    const task = Promise.all(c.frames.map(url => new Promise((resolve,reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('画像が見つかりません: '+url));
      img.src = `${url}?v=${VERSION}`;
    })));
    imagePromises.set(c.key, task);
    try {
      const images = await task;
      // 直近2種類だけメモリに保持。他はブラウザのHTTPキャッシュに任せる。
      if(imagePromises.size > 2) {
        const first = imagePromises.keys().next().value;
        if(first !== c.key) imagePromises.delete(first);
      }
      return images;
    } catch(err) {
      imagePromises.delete(c.key);
      throw err;
    }
  }

  // 描画はCanvasTextureを1つだけ更新する方式。PNGを切り替えるたびに新しいWebGLテクスチャを作らない。
  function ensureGraphics(c, images) {
    if(gfx[c.idx]) return gfx[c.idx];
    const canvas = document.createElement('canvas');
    const first = images[0];
    const f = Math.min(1,1024/Math.max(first.naturalWidth,first.naturalHeight));
    canvas.width = Math.max(1,Math.round(first.naturalWidth*f));
    canvas.height = Math.max(1,Math.round(first.naturalHeight*f));
    const ctx = canvas.getContext('2d', {alpha:true});
    const tex = new THREE.CanvasTexture(canvas);
    if(THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    else if(THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    const mat = new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthWrite:false,alphaTest:0.005});
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1,1),mat);
    plane.scale.set(c.width,c.width*(canvas.height/canvas.width),1);
    performers[c.idx].object3D.add(plane);
    gfx[c.idx] = {canvas,ctx,tex,plane,frame:-1};
    return gfx[c.idx];
  }
  function paint(c,images,i) {
    const g=ensureGraphics(c,images);
    if(g.frame===i) return;
    g.frame=i;
    g.ctx.clearRect(0,0,g.canvas.width,g.canvas.height);
    g.ctx.drawImage(images[i],0,0,g.canvas.width,g.canvas.height);
    g.tex.needsUpdate=true;
  }
  function pose(c,t) {
    const o=performers[c.idx].object3D;
    let x=0,y=0,z=0.02,s=1,rot=0;
    if(c.kind==='walk') {
      const p=clamp(t/c.duration);
      x=lerp(1.0,-2.2,p);y=-0.18;s=1;
    } else if(c.kind==='gasha') {
      if(t<1900) {
        const p=ease(clamp(t/1900));
        y=lerp(-1.25,-0.28,p);s=lerp(0.25,0.83,p);rot=-2;
      } else if(t<3650) {
        const p=ease(clamp((t-1900)/1750));
        y=lerp(-0.28,0.08,p);s=lerp(0.83,1.28,p);rot=Math.sin(t/170)*rad(2);
      } else {
        const p=ease(clamp((t-3650)/430));
        y=lerp(0.08,0.28,p);s=lerp(1.28,2.05,p);
      }
    } else if(c.kind==='spinAway') {
      const p=ease(clamp(t/c.duration));
      x=lerp(0.05,-1.15,p);y=lerp(-0.1,0.5,p);s=lerp(1.05,0.07,p);rot=rad(720*p);
    } else if(c.kind==='dance') {
      const p=ease(clamp(t/c.duration));
      x=lerp(-0.25,1.25,p);y=lerp(-0.12,0.45,p)+Math.sin(t/220)*0.045;
      s=lerp(1.02,0.09,p);rot=rad(720*p);
    } else if(c.kind==='crawl') {
      const p=clamp(t/c.duration);
      x=lerp(-1.0,1.2,p);y=-0.39+0.025*Math.sin(t/180);
      s=0.92+0.04*Math.sin(t/410);rot=rad(3*Math.sin(t/220));
    } else if(c.kind==='slither') {
      const p=clamp(t/c.duration);
      x=lerp(1.05,-1.35,p);y=-0.35+0.035*Math.sin(t/260);
      s=0.95;rot=rad(4*Math.sin(t/260));
    } else if(c.kind==='parade') {
      const p=clamp(t/c.duration);
      x=lerp(0.12,-0.12,p);y=-0.08;s=1.0;
    } else if(c.kind==='poster') {
      x=0;y=0.02*Math.sin(t/420);s=1+0.025*Math.sin(t/600);
      rot=rad(1.1*Math.sin(t/800));
    }
    o.position.set(x,y,z);
    o.scale.set(s,s,s);
    o.rotation.set(0,0,rot);
  }
  function frameNumber(c,t) {
    if(c.kind==='gasha') return t<650?0:t<1250?1:t<1900?2:t<3650?3:4;
    if(c.kind==='parade') return Math.min(4, Math.floor(t/c.frameMs));
    return Math.floor(t/c.frameMs)%5;
  }
  function stopPlayback() {
    if(raf) cancelAnimationFrame(raf);
    raf=0; playback=null;
    for(const p of performers) p.setAttribute('visible',false);
    darkOverlay.classList.remove('active');
    flashOverlay.classList.remove('flash');
  }
  function tick(now) {
    if(!playback) return;
    const {c,images,startTime} = playback;
    const t=Math.max(0, now-startTime);
    paint(c,images,frameNumber(c,t));
    pose(c,t);
    if(c.kind==='gasha' && t>=3650 && !playback.flashed) {
      playback.flashed=true;
      flashOverlay.classList.remove('flash');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash');
    }
    if(c.duration && t>=c.duration) {
      // ガシャ髑髏と百鬼夜行は最後の姿で停止。ほかは画面外へ消える。
      if(c.kind!=='gasha' && c.kind!=='parade') performers[c.idx].setAttribute('visible',false);
      playback=null;raf=0;
      darkOverlay.classList.remove('active');
      return;
    }
    raf=requestAnimationFrame(tick);
  }
  async function onFound(i) {
    if(active===i) return;
    trackingToken++;
    const token=trackingToken;
    stopPlayback();active=i;
    const c=cfg[i];
    say(`${c.name}を発見！`,'妖怪を呼び出しています…');
    try {
      const images=await loadImages(c);
      if(active!==i || token!==trackingToken) return;
      const g=ensureGraphics(c,images);
      g.frame=-1;
      paint(c,images,0);
      pose(c,0);
      performers[i].setAttribute('visible',true);
      if(c.kind==='gasha') darkOverlay.classList.add('active');
      hideGuideSoon();
      playback={c,images,startTime:performance.now(),flashed:false};
      raf=requestAnimationFrame(tick);
    } catch(err) {
      if(active===i && token===trackingToken) showError(String(err.message || err));
    }
  }
  function onLost(i) {
    if(active!==i) return;
    trackingToken++;
    active=-1;
    stopPlayback();
    errorBox.style.display='none';
    say('AR百鬼夜行','絵や札にスマホを向けてください');
  }
  function setup() {
    cfg.forEach(c => {
      anchors[c.idx].addEventListener('targetFound',()=>onFound(c.idx));
      anchors[c.idx].addEventListener('targetLost',()=>onLost(c.idx));
    });
    scene.addEventListener('arReady',()=>say('AR起動完了！','絵や札にスマホを向けてください'));
    scene.addEventListener('arError',()=>showError('ARが起動できませんでした。targets.mind が正しいファイルか、カメラの許可をご確認ください。'));
    // コンパイル済みデータの取り違えを早期に発見するチェック。
    fetch(`./targets.mind?v=${VERSION}`,{method:'HEAD',cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(`targets.mind にアクセスできません（HTTP ${r.status}）`);
      const n=Number(r.headers.get('content-length'));
      if(n && n<100000) throw new Error(`targets.mind が小さすぎます（${n}バイト）。正しいコンパイル済みファイルを再アップロードしてください。`);
    }).catch(e=>showError(String(e.message||e)));
  }
  if(scene.hasLoaded) setup();
  else scene.addEventListener('loaded',setup,{once:true});
})();
</script>
</body>
</html>
