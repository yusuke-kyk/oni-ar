<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AR鬼テスト</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    .guide {
      position: fixed;
      z-index: 9999;
      left: 50%;
      top: max(20px, env(safe-area-inset-top));
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 420px;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      text-align: center;
      font-family: sans-serif;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="guide">
    👹 AR鬼テスト<br>
    印刷した画像にカメラを向けてください
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- 鬼PNGを読み込む -->
    <a-assets>
      <img
        id="oniImage"
        src="./oni.png"
        crossorigin="anonymous"
      >
    </a-assets>

    <!-- スマホカメラ -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- targets.mind の1枚目を認識 -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 認識した場所に鬼を表示 -->
      <a-plane
        src="#oniImage"
        position="0 0 0"
        width="1"
        height="1.4"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double;
        "
      ></a-plane>

    </a-entity>

  </a-scene>

</body>
</html>
