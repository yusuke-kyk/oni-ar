<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>AR百鬼夜行</title>


  <!-- ======================================================
       A-Frame 1.5.0
       ====================================================== -->

  <script
    src="https://aframe.io/releases/1.5.0/aframe.min.js">
  </script>


  <!-- ======================================================
       MindAR 1.2.5
       ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js">
  </script>


  <style>

    /* ======================================================
       基本
       ====================================================== */

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: transparent;

      touch-action: none;

    }


    /* ======================================================
       カメラ映像
       ====================================================== */

    video {

      position: fixed !important;

      top: 0 !important;
      left: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      z-index: 0 !important;

    }


    /* ======================================================
       A-Frame
       ====================================================== */

    a-scene {

      position: fixed !important;

      top: 0;
      left: 0;

      width: 100vw !important;
      height: 100vh !important;

      z-index: 1;

      background: transparent !important;

    }


    .a-canvas {

      background: transparent !important;

    }


    /* ======================================================
       上部メッセージ
       ====================================================== */

    #guide {

      position: fixed;

      z-index: 10000;

      left: 50%;

      top: max(
        14px,
        env(safe-area-inset-top)
      );

      transform: translateX(-50%);

      width: calc(100% - 32px);

      max-width: 440px;

      box-sizing: border-box;

      padding: 9px 14px;

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.55);

      color: #ffffff;

      text-align: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;

      font-size: 14px;

      line-height: 1.5;

      pointer-events: none;

      opacity: 1;

      transition: opacity 0.35s ease;

    }


    #guide.hide {

      opacity: 0;

    }


    /* ======================================================
       ガシャ髑髏用 暗転
       ====================================================== */

    #darkOverlay {

      position: fixed;

      inset: 0;

      z-index: 8000;

      pointer-events: none;

      background: rgba(0, 0, 0, 0);

      transition:
        background 1.2s ease;

    }


    #darkOverlay.active {

      background:
        rgba(0, 0, 0, 0.28);

    }


    /* ======================================================
       ガシャ髑髏
       最後の赤フラッシュ
       ====================================================== */

    #flashOverlay {

      position: fixed;

      inset: 0;

      z-index: 9000;

      pointer-events: none;

      background:
        rgba(80, 0, 0, 0);

    }


    #flashOverlay.flash {

      animation:
        scaryFlash
        360ms
        ease-out;

    }


    @keyframes scaryFlash {

      0% {

        background:
          rgba(80, 0, 0, 0);

      }

      22% {

        background:
          rgba(100, 0, 0, 0.24);

      }

      100% {

        background:
          rgba(80, 0, 0, 0);

      }

    }

  </style>

</head>


<body>


  <!-- ======================================================
       演出用レイヤー
       ====================================================== -->

  <div id="darkOverlay"></div>

  <div id="flashOverlay"></div>


  <div id="guide">

    AR起動中……

  </div>



  <!-- ======================================================
       AR SCENE
       ====================================================== -->

  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc: ./targets.mind?v=20260918-1;
      autoStart: true;
      maxTrack: 2;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="
      enabled: false
    "

    device-orientation-permission-ui="
      enabled: false
    "

    embedded

  >


    <!-- ====================================================
         画像素材
         ==================================================== -->

    <a-assets timeout="20000">


      <!-- ==========================
           豆腐小僧
           ========================== -->

      <img
        id="tofu01"
        src="./tofu01.png"
        crossorigin="anonymous"
      >

      <img
        id="tofu02"
        src="./tofu02.png"
        crossorigin="anonymous"
      >

      <img
        id="tofu03"
        src="./tofu03.png"
        crossorigin="anonymous"
      >

      <img
        id="tofu04"
        src="./tofu04.png"
        crossorigin="anonymous"
      >

      <img
        id="tofu05"
        src="./tofu05.png"
        crossorigin="anonymous"
      >


      <!-- ==========================
           ガシャ髑髏
           ========================== -->

      <img
        id="gasha01"
        src="./gasha01.png"
        crossorigin="anonymous"
      >

      <img
        id="gasha02"
        src="./gasha02.png"
        crossorigin="anonymous"
      >

      <img
        id="gasha03"
        src="./gasha03.png"
        crossorigin="anonymous"
      >

      <img
        id="gasha04"
        src="./gasha04.png"
        crossorigin="anonymous"
      >

      <img
        id="gasha05"
        src="./gasha05.png"
        crossorigin="anonymous"
      >


    </a-assets>



    <!-- ====================================================
         CAMERA
         ==================================================== -->

    <a-camera

      position="0 0 0"

      look-controls="
        enabled: false
      "

    ></a-camera>



    <!-- ====================================================
         TARGET 0
         豆腐小僧
         ==================================================== -->

    <a-entity

      id="tofuTarget"

      mindar-image-target="
        targetIndex: 0
      "

    >


      <a-entity

        id="tofuWalker"

        position="
          1
          -0.18
          0.01
        "

        visible="false"

      >


        <a-image

          id="tofuSprite"

          src="#tofu01"

          width="0.72"

          height="1.02"

          position="0 0 0"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "

        ></a-image>


      </a-entity>


    </a-entity>



    <!-- ====================================================
         TARGET 1
         ガシャ髑髏
         ==================================================== -->

    <a-entity

      id="gashaTarget"

      mindar-image-target="
        targetIndex: 1
      "

    >


      <a-entity

        id="gashaMonster"

        position="
          0
          -1.25
          0.02
        "

        scale="
          0.25
          0.25
          0.25
        "

        rotation="
          0
          0
          -2
        "

        visible="false"

      >


        <a-image

          id="gashaSprite"

          src="#gasha01"

          width="1.30"

          height="1.80"

          position="0 0 0"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "

        ></a-image>


      </a-entity>


    </a-entity>


  </a-scene>



  <script>


    document.addEventListener(
      "DOMContentLoaded",
      () => {


        /* ==================================================
           ELEMENTS
           ================================================== */

        const scene =
          document.getElementById(
            "arScene"
          );


        const guide =
          document.getElementById(
            "guide"
          );


        const darkOverlay =
          document.getElementById(
            "darkOverlay"
          );


        const flashOverlay =
          document.getElementById(
            "flashOverlay"
          );


        const tofuTarget =
          document.getElementById(
            "tofuTarget"
          );


        const tofuWalker =
          document.getElementById(
            "tofuWalker"
          );


        const tofuSprite =
          document.getElementById(
            "tofuSprite"
          );


        const gashaTarget =
          document.getElementById(
            "gashaTarget"
          );


        const gashaMonster =
          document.getElementById(
            "gashaMonster"
          );


        const gashaSprite =
          document.getElementById(
            "gashaSprite"
          );



        /* ==================================================
           AR起動イベント
           ================================================== */


        scene.addEventListener(
          "arReady",
          () => {

            console.log(
              "MindAR ready"
            );


            guide.textContent =
              "絵や札にスマホを向けてください";

          }
        );


        scene.addEventListener(
          "arError",
          () => {

            console.error(
              "MindAR start error"
            );


            guide.textContent =
              "ARの起動に失敗しました。再読み込みしてください。";

          }
        );



        /* ==================================================
           豆腐小僧
           ================================================== */


        const tofuFrames = [

          "#tofu01",
          "#tofu02",
          "#tofu03",
          "#tofu04",
          "#tofu05"

        ];


        const TOFU_FRAME_INTERVAL =
          130;


        const TOFU_WALK_DURATION =
          6500;


        const TOFU_START = {

          x: 1.0,
          y: -0.18,
          z: 0.01

        };


        const TOFU_END = {

          x: -2.2,
          y: -0.18,
          z: 0.01

        };


        let tofuFrameIndex =
          0;


        let tofuFrameTimer =
          null;


        let tofuEndTimer =
          null;


        let tofuRunning =
          false;



        function setTofuPosition(
          p
        ) {

          tofuWalker.setAttribute(

            "position",

            `${p.x} ${p.y} ${p.z}`

          );

        }



        function stopTofuFrames() {

          if (
            tofuFrameTimer !== null
          ) {

            clearInterval(
              tofuFrameTimer
            );


            tofuFrameTimer =
              null;

          }

        }



        function startTofuFrames() {


          stopTofuFrames();


          tofuFrameTimer =

            setInterval(

              () => {


                tofuFrameIndex =

                  (
                    tofuFrameIndex
                    +
                    1
                  )

                  %

                  tofuFrames.length;


                tofuSprite.setAttribute(

                  "src",

                  tofuFrames[
                    tofuFrameIndex
                  ]

                );


              },

              TOFU_FRAME_INTERVAL

            );

        }



        function resetTofu() {


          stopTofuFrames();


          if (
            tofuEndTimer !== null
          ) {

            clearTimeout(
              tofuEndTimer
            );


            tofuEndTimer =
              null;

          }


          tofuWalker.removeAttribute(
            "animation__walk"
          );


          tofuFrameIndex =
            0;


          tofuSprite.setAttribute(

            "src",

            tofuFrames[0]

          );


          setTofuPosition(
            TOFU_START
          );


          tofuWalker.setAttribute(

            "visible",

            false

          );


          tofuRunning =
            false;

        }



        function startTofu() {


          if (
            tofuRunning
          ) {

            return;

          }


          tofuRunning =
            true;


          tofuFrameIndex =
            0;


          tofuSprite.setAttribute(

            "src",

            tofuFrames[0]

          );


          setTofuPosition(
            TOFU_START
          );


          tofuWalker.setAttribute(

            "visible",

            true

          );


          startTofuFrames();


          tofuWalker.removeAttribute(
            "animation__walk"
          );


          setTimeout(

            () => {


              tofuWalker.setAttribute(

                "animation__walk",

                {

                  property:
                    "position",

                  from:
                    `${TOFU_START.x} ${TOFU_START.y} ${TOFU_START.z}`,

                  to:
                    `${TOFU_END.x} ${TOFU_END.y} ${TOFU_END.z}`,

                  dur:
                    TOFU_WALK_DURATION,

                  easing:
                    "linear",

                  loop:
                    false

                }

              );


            },

            50

          );


          tofuEndTimer =

            setTimeout(

              () => {


                stopTofuFrames();


                tofuWalker.setAttribute(

                  "visible",

                  false

                );


                tofuRunning =
                  false;


              },

              TOFU_WALK_DURATION
              +
              100

            );

        }



        /* ==================================================
           ガシャ髑髏
           ================================================== */


        const gashaFrames = [

          "#gasha01",
          "#gasha02",
          "#gasha03",
          "#gasha04",
          "#gasha05"

        ];


        let gashaRunning =
          false;


        let gashaTimers =
          [];



        function addGashaTimer(
          callback,
          delay
        ) {


          const timer =

            setTimeout(

              callback,

              delay

            );


          gashaTimers.push(
            timer
          );

        }



        function clearGashaTimers() {


          gashaTimers.forEach(

            timer => {

              clearTimeout(
                timer
              );

            }

          );


          gashaTimers = [];

        }



        function showGashaFrame(
          number
        ) {


          gashaSprite.setAttribute(

            "src",

            gashaFrames[number]

          );

        }



        function resetGasha() {


          clearGashaTimers();


          gashaMonster.removeAttribute(
            "animation__rise"
          );


          gashaMonster.removeAttribute(
            "animation__grow"
          );


          gashaMonster.removeAttribute(
            "animation__sway"
          );


          gashaMonster.removeAttribute(
            "animation__attackPosition"
          );


          gashaMonster.removeAttribute(
            "animation__attackScale"
          );


          gashaMonster.setAttribute(

            "position",

            "0 -1.25 0.02"

          );


          gashaMonster.setAttribute(

            "scale",

            "0.25 0.25 0.25"

          );


          gashaMonster.setAttribute(

            "rotation",

            "0 0 -2"

          );


          showGashaFrame(
            0
          );


          gashaMonster.setAttribute(

            "visible",

            false

          );


          darkOverlay
            .classList
            .remove(
              "active"
            );


          flashOverlay
            .classList
            .remove(
              "flash"
            );


          gashaRunning =
            false;

        }



        function startGasha() {


          if (
            gashaRunning
          ) {

            return;

          }


          gashaRunning =
            true;


          /* ----------------------------------------------
             START
             ---------------------------------------------- */


          showGashaFrame(
            0
          );


          gashaMonster.setAttribute(

            "position",

            "0 -1.25 0.02"

          );


          gashaMonster.setAttribute(

            "scale",

            "0.25 0.25 0.25"

          );


          gashaMonster.setAttribute(

            "rotation",

            "0 0 -2"

          );


          gashaMonster.setAttribute(

            "visible",

            true

          );


          darkOverlay
            .classList
            .add(
              "active"
            );


          /* ----------------------------------------------
             PHASE 1

             下からヌーッ……
             ---------------------------------------------- */


          gashaMonster.setAttribute(

            "animation__rise",

            {

              property:
                "position",

              from:
                "0 -1.25 0.02",

              to:
                "0 -0.28 0.02",

              dur:
                1900,

              easing:
                "easeOutQuad",

              loop:
                false

            }

          );


          gashaMonster.setAttribute(

            "animation__grow",

            {

              property:
                "scale",

              from:
                "0.25 0.25 0.25",

              to:
                "0.83 0.83 0.83",

              dur:
                1900,

              easing:
                "easeOutQuad",

              loop:
                false

            }

          );



          /* 2枚目 */

          addGashaTimer(

            () => {

              showGashaFrame(
                1
              );

            },

            650

          );



          /* 3枚目 */

          addGashaTimer(

            () => {

              showGashaFrame(
                2
              );

            },

            1250

          );



          /* ----------------------------------------------
             PHASE 2

             こちらを見ながら
             ゆらゆら近付く
             ---------------------------------------------- */


          addGashaTimer(

            () => {


              showGashaFrame(
                3
              );


              gashaMonster.removeAttribute(
                "animation__rise"
              );


              gashaMonster.removeAttribute(
                "animation__grow"
              );


              gashaMonster.setAttribute(

                "animation__sway",

                {

                  property:
                    "rotation",

                  from:
                    "0 0 -2",

                  to:
                    "0 0 2",

                  dur:
                    320,

                  dir:
                    "alternate",

                  easing:
                    "easeInOutSine",

                  loop:
                    true

                }

              );


              gashaMonster.setAttribute(

                "animation__attackPosition",

                {

                  property:
                    "position",

                  from:
                    "0 -0.28 0.02",

                  to:
                    "0 0.08 0.02",

                  dur:
                    1700,

                  easing:
                    "easeInOutQuad",

                  loop:
                    false

                }

              );


              gashaMonster.setAttribute(

                "animation__attackScale",

                {

                  property:
                    "scale",

                  from:
                    "0.83 0.83 0.83",

                  to:
                    "1.28 1.28 1.28",

                  dur:
                    1700,

                  easing:
                    "easeInOutQuad",

                  loop:
                    false

                }

              );


            },

            1900

          );



          /* ----------------------------------------------
             PHASE 3

             最後にズンッ！！
             ---------------------------------------------- */


          addGashaTimer(

            () => {


              showGashaFrame(
                4
              );


              gashaMonster.removeAttribute(
                "animation__sway"
              );


              gashaMonster.removeAttribute(
                "animation__attackPosition"
              );


              gashaMonster.removeAttribute(
                "animation__attackScale"
              );


              /* 赤フラッシュ */


              flashOverlay
                .classList
                .remove(
                  "flash"
                );


              void
                flashOverlay.offsetWidth;


              flashOverlay
                .classList
                .add(
                  "flash"
                );


              /* 最後の突進 */


              gashaMonster.setAttribute(

                "animation__attackPosition",

                {

                  property:
                    "position",

                  from:
                    "0 0.08 0.02",

                  to:
                    "0 0.28 0.02",

                  dur:
                    430,

                  easing:
                    "easeOutExpo",

                  loop:
                    false

                }

              );


              gashaMonster.setAttribute(

                "animation__attackScale",

                {

                  property:
                    "scale",

                  from:
                    "1.28 1.28 1.28",

                  to:
                    "2.05 2.05 2.05",

                  dur:
                    430,

                  easing:
                    "easeOutExpo",

                  loop:
                    false

                }

              );


            },

            3650

          );



          /* ----------------------------------------------
             演出終了
             ---------------------------------------------- */


          addGashaTimer(

            () => {

              gashaRunning =
                false;

            },

            4300

          );

        }



        /* ==================================================
           TARGET FOUND
           ================================================== */


        tofuTarget.addEventListener(

          "targetFound",

          () => {


            console.log(
              "TOFU target found"
            );


            guide.classList.add(
              "hide"
            );


            resetTofu();

            startTofu();


          }

        );



        gashaTarget.addEventListener(

          "targetFound",

          () => {


            console.log(
              "GASHA target found"
            );


            guide.classList.add(
              "hide"
            );


            resetGasha();

            startGasha();


          }

        );



        /* ==================================================
           TARGET LOST
           ================================================== */


        tofuTarget.addEventListener(

          "targetLost",

          () => {


            console.log(
              "TOFU target lost"
            );


            resetTofu();


            guide.classList.remove(
              "hide"
            );


          }

        );



        gashaTarget.addEventListener(

          "targetLost",

          () => {


            console.log(
              "GASHA target lost"
            );


            resetGasha();


            guide.classList.remove(
              "hide"
            );


          }

        );



        /* ==================================================
           初期化
           ================================================== */


        resetTofu();

        resetGasha();


      }
    );


  </script>


</body>

</html>
